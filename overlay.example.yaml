# Example overlay config for fitvid compile --overlay
# Default measurement system is FPS (US customary: mph, ft, °F).
# Use unit_system: metric for km/h, m, °C. Alias: imperial == fps.
overlay:
  unit_system: fps
  text:
    - field: speed
      format: "{value:.1f} mph"
      anchor: bottom-left
      unit_system: fps
    - field: heart_rate
      label: "HR"
      format: "{value:.0f} bpm"
      anchor: bottom-right
      color: "#FF5A36"
  map:
    style: route-only
    anchor: top-right
    width_px: 300
    height_px: 300
  allow_overlap: false
